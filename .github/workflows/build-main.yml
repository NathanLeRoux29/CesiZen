name: Build Production

# Déclenché sur chaque push sur la branche main
# Valide que les images Docker de production se construisent correctement
# Prévu pour intégrer un push vers Docker Hub ou GitHub Container Registry lors d'un vrai déploiement
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-images:
    name: Build des images Docker de production
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Build image Docker backend
        run: docker build -t cesizen-backend:latest ./backend

      # VITE_API_URL est gravée dans le bundle JS au moment du build
      # En production réelle, remplacer http://localhost:3001 par l'URL publique de l'API
      - name: Build image Docker frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:3001 \
            -t cesizen-frontend:latest \
            ./frontend

      - name: Build image Docker backoffice
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:3001 \
            -t cesizen-backoffice:latest \
            ./backoffice

      # Affiche un récapitulatif des images construites avec leur taille
      - name: Résumé du build
        run: |
          echo "Images buildées avec succès"
          docker images | grep cesizen
