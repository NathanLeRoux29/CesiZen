name: Build Production

# Déclenché sur chaque push/PR sur la branche main
# Build PUIS pousse les 3 images sur GHCR, taguées :latest ET :<sha-court> (traçabilité).
# Le push s'exécute aussi sur les PR internes (workflow PR-only : pas de push direct sur les branches).
# Les PR venant d'un fork sont exclues du push (GITHUB_TOKEN en lecture seule).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions nécessaires pour publier les images sur GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build et push des images Docker (production)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # GHCR exige des noms d'images en minuscules — on calcule le préfixe ghcr.io/<owner>
      - name: Définir le préfixe des images
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # SHA court du commit — sert de tag de traçabilité exacte (ex: a3f9c12)
      - name: Définir le tag de commit
        run: echo "SHA_TAG=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      # Connexion à GHCR — sur push, dispatch et PR internes (pas sur les PR de forks : token en lecture seule)
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend — tagué :latest (version courante) + :<sha> (traçabilité)
      - name: Build image Docker backend
        run: |
          docker build \
            -t $IMAGE_PREFIX/cesizen-backend:latest \
            -t $IMAGE_PREFIX/cesizen-backend:$SHA_TAG \
            ./backend

      - name: Push image backend
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: docker push --all-tags $IMAGE_PREFIX/cesizen-backend

      # Frontend
      # VITE_API_URL est gravée dans le bundle JS au moment du build
      # En production réelle, remplacer http://localhost:3001 par l'URL publique de l'API
      - name: Build image Docker frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:3001 \
            -t $IMAGE_PREFIX/cesizen-frontend:latest \
            -t $IMAGE_PREFIX/cesizen-frontend:$SHA_TAG \
            ./frontend

      - name: Push image frontend
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: docker push --all-tags $IMAGE_PREFIX/cesizen-frontend

      # Backoffice
      - name: Build image Docker backoffice
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:3001 \
            -t $IMAGE_PREFIX/cesizen-backoffice:latest \
            -t $IMAGE_PREFIX/cesizen-backoffice:$SHA_TAG \
            ./backoffice

      - name: Push image backoffice
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: docker push --all-tags $IMAGE_PREFIX/cesizen-backoffice

      # Affiche un récapitulatif des images construites
      - name: Résumé du build
        run: |
          echo "Images buildées avec succès (tags : latest + $SHA_TAG)"
          docker images | grep cesizen
          echo "Poussées sur GHCR sous $IMAGE_PREFIX/cesizen-* (sauf PR de fork)"
