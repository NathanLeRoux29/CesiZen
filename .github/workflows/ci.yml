name: CI Tests automatiques

# Déclenché sur chaque Pull Request vers dev ou preprod
on:
  pull_request:
    branches:
      - dev
      - preprod

jobs:
  tests-backend:
    name: Tests backend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances backend
        working-directory: backend
        run: npm ci

      - name: Lancement des tests Jest
        working-directory: backend
        run: npm test
