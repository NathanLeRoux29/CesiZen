name: CI Tests automatiques

# Déclenché automatiquement sur chaque Pull Request vers dev, preprod ou main
# Peut aussi être lancé manuellement depuis l'onglet Actions de GitHub
on:
  pull_request:
    branches:
      - dev
      - preprod
      - main
  workflow_dispatch:

# Permissions nécessaires pour créer des issues automatiquement en cas d'échec
permissions:
  issues: write
  contents: read

jobs:
  # Job 1 : tests unitaires du backend + audit de sécurité
  tests-backend:
    name: Tests backend (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances backend
        working-directory: backend
        run: npm ci

      - name: Lancement des tests Jest
        working-directory: backend
        run: npm test

      # Vérifie que les dépendances npm n'ont pas de vulnérabilités connues (CVE)
      # --audit-level=high : échoue uniquement sur les vulnérabilités high et critical
      - name: Audit de sécurité des dépendances backend
        working-directory: backend
        run: npm audit --audit-level=high

      # Crée automatiquement une issue GitHub si le job échoue
      - name: Créer une issue en cas d'échec
        if: failure()
        run: |
          gh issue create \
            --title "[BUG] Échec CI backend sur ${{ github.head_ref || github.ref_name }}" \
            --body "## Échec de la CI — Tests backend

          **Branche :** \`${{ github.head_ref || github.ref_name }}\`
          **Commit :** \`${{ github.sha }}\`
          **Déclenché par :** @${{ github.actor }}

          [Voir les logs du workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug" \
            --assignee "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2 : build du frontend + audit de sécurité
  build-frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances frontend
        working-directory: frontend
        run: npm install -g npm@11.6.1 && npm ci

      # Vérifie que le code Vue.js compile sans erreur
      - name: Build Vite
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Audit de sécurité des dépendances frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Créer une issue en cas d'échec
        if: failure()
        run: |
          gh issue create \
            --title "[BUG] Échec CI frontend sur ${{ github.head_ref || github.ref_name }}" \
            --body "## Échec de la CI — Build frontend

          **Branche :** \`${{ github.head_ref || github.ref_name }}\`
          **Commit :** \`${{ github.sha }}\`
          **Déclenché par :** @${{ github.actor }}

          [Voir les logs du workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug" \
            --assignee "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3 : build du backoffice + audit de sécurité
  build-backoffice:
    name: Build backoffice (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json

      - name: Installation des dépendances backoffice
        working-directory: backoffice
        run: npm install -g npm@11.6.1 && npm ci

      - name: Build Vite
        working-directory: backoffice
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Audit de sécurité des dépendances backoffice
        working-directory: backoffice
        run: npm audit --audit-level=high

      - name: Créer une issue en cas d'échec
        if: failure()
        run: |
          gh issue create \
            --title "[BUG] Échec CI backoffice sur ${{ github.head_ref || github.ref_name }}" \
            --body "## Échec de la CI — Build backoffice

          **Branche :** \`${{ github.head_ref || github.ref_name }}\`
          **Commit :** \`${{ github.sha }}\`
          **Déclenché par :** @${{ github.actor }}

          [Voir les logs du workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug" \
            --assignee "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
