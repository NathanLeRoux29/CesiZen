services:

  # Base de données MySQL
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   
      MYSQL_DATABASE: ${DB_NAME}                 
      MYSQL_USER: ${DB_USER}                     
      MYSQL_PASSWORD: ${DB_PASSWORD}             
    volumes:
      - mysql_data:/var/lib/mysql                
      - ./backend/sql/cesizen.sql:/docker-entrypoint-initdb.d/cesizen.sql:ro  
    networks:
      - backend-network                          
    healthcheck:
      # Vérifie que MySQL accepte les connexions avant de démarrer le backend
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s   
      timeout: 5s     
      retries: 10     

  # API REST Node.js/Express
  backend:
    build: ./backend                             
    environment:
      PORT: 3001
      DB_HOST: mysql                             
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3001:3001"                              
    depends_on:
      mysql:
        condition: service_healthy               
    networks:
      - backend-network                          
      - public-network                           
    restart: unless-stopped                      

  # CesiZen Vue.js
  frontend:
    build:
      context: ./frontend                        
      args:
        VITE_API_URL: ${VITE_API_URL}            
    ports:
      - "5173:80"                                
    networks:
      - public-network
    depends_on:
      - backend

  # BackOffice Vue.js ---
  backoffice:
    build:
      context: ./backoffice
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5174:80"
    networks:
      - public-network
    depends_on:
      - backend

  # Monitoring Uptime Kuma
  uptime-kuma:
    image: louislam/uptime-kuma:1               # Image officielle, pas de build custom nécessaire
    ports:
      - "3002:3001"                              # Uptime Kuma écoute sur 3001 en interne
    volumes:
      - uptime_kuma_data:/app/data              # Sauvegarde la configuration des monitors
    networks:
      - public-network
    restart: unless-stopped

# Réseaux
networks:
  backend-network:
    driver: bridge   # Réseau privé : backend <-> mysql uniquement
  public-network:
    driver: bridge   # Réseau accessible : frontend, backoffice, uptime-kuma, backend

# Volumes persistants
volumes:
  mysql_data:         
  uptime_kuma_data:  
